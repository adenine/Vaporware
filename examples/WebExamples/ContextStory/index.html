<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContextStory — Vaporware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<!--
  ContextStory — a live Spacebrew story

  Registers as a Spacebrew 2.0 client (subscriber only, fixed name
  "ContextStory") and listens for five context topics, matching the
  real payload shapes published by VaporwareEnvironmentObserver
  (../../../../VaporwareEnvironmentObserver/vaporwareenvironmentobserver/spacebrew/events.py):

    place              plain string, e.g. "Brooklyn, NY"
    weather            JSON: {temperature_c, humidity_pct, wind_kph, condition}
    location           JSON: {latitude, longitude, accuracy}
    location_latlong   plain "lat,long" string, e.g. "40.6602,-73.969"
    air_quality        JSON: {us_aqi, pm2_5, pm10, ozone, nitrogen_dioxide}

  ...and weaves whatever it's heard most recently into one big,
  color-coded, continuously-updating sentence — filling the whole
  browser window. This is the "Sensing -> structured event -> Stories"
  idea from 01-taxonomy.md (auto-narrative from other domains' data)
  and 03-components.md's Environment-domain context (location, weather,
  air quality), rendered as an ambient display rather than logged text.

  Any of the five values that aren't valid JSON are shown as plain text
  instead of crashing, so this also works against a simpler test
  publisher that just sends plain strings for all five topics.

  This page only declares its own subscriber slots — same shape as the
  "Magic Word" Processing example (../../ProcessingExamples/MagicWord/MagicWord.pde).
  It doesn't wire itself to VaporwareEnvironmentObserver's publishers;
  that's a Spacebrew patch-bay connection (or `POST /api/routes`), left
  as a separate step since VaporwareEnvironmentObserver's publishers may
  already be routed elsewhere (check `GET /api/routes` first — the
  router only keeps one subscriber per publisher today, so wiring a new
  route here replaces whatever that publisher was routed to before).

  Requires Spacebrew 2.0 running locally (default: `python main.py`
  inside Spacebrew2.0/Spacebrew2.0 — see that project's README), which
  serves the WebSocket gateway this page connects to at
  ws://localhost:8088/ws/client.

  Quick manual test with no routing at all — from a terminal, once
  Spacebrew 2.0 is running and this page is open, publish straight to
  ContextStory's own topics:

    curl -X POST http://localhost:8088/api/publish -H "Content-Type: application/json" \
      -d '{"topic": "ContextStory/place", "message": "Brooklyn, NY"}'

    curl -X POST http://localhost:8088/api/publish -H "Content-Type: application/json" \
      -d '{"topic": "ContextStory/weather", "message": "{\"temperature_c\": 16, \"humidity_pct\": 71, \"wind_kph\": 12, \"condition\": \"light rain\"}"}'

    curl -X POST http://localhost:8088/api/publish -H "Content-Type: application/json" \
      -d '{"topic": "ContextStory/location", "message": "{\"latitude\": 40.6602, \"longitude\": -73.969, \"accuracy\": 12}"}'

    curl -X POST http://localhost:8088/api/publish -H "Content-Type: application/json" \
      -d '{"topic": "ContextStory/location_latlong", "message": "40.6602,-73.969"}'

    curl -X POST http://localhost:8088/api/publish -H "Content-Type: application/json" \
      -d '{"topic": "ContextStory/air_quality", "message": "{\"us_aqi\": 42, \"pm2_5\": 8.1, \"pm10\": 14, \"ozone\": 31, \"nitrogen_dioxide\": 9}"}'

  Each one lands on screen the instant it's published, in that
  variable's own color, with a brief flash.
-->
<style>
  :root {
    --bg: #0a0a0d;
    --ink: #d8d8e2;
    --ink-dim: #6e6e7c;

    --c-place: #ffb454;
    --c-weather: #b98bff;
    --c-location: #5ec8f8;
    --c-latlong: #3fe0c5;
    --c-air-default: #7ee08a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: auto;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    font-family: "Instrument Serif", Georgia, serif;
  }

  main {
    max-width: 1400px;
    padding: 6vmin 7vmin;
  }

  #story {
    margin: 0;
    text-align: left;
    color: var(--ink);
    font-weight: 400;
    line-height: 1.3;
    font-size: clamp(1.8rem, 4.6vw, 5.5rem);
    letter-spacing: 0.002em;
  }

  .var {
    font-style: italic;
    white-space: nowrap;
  }
  .var.wrap { white-space: normal; }

  .var.pending {
    opacity: 0.45;
    filter: none !important;
    text-shadow: none !important;
    animation: none !important;
  }

  .v-place       { color: var(--c-place); }
  .v-weather     { color: var(--c-weather); }
  .v-location    { color: var(--c-location); }
  .v-latlong     { color: var(--c-latlong); }
  .v-air         { color: var(--c-air-default); }

  /* slow ambient glow, staggered per-variable so the page never sits
     perfectly still even with no new messages arriving */
  .v-place    { animation: glow 4.6s ease-in-out infinite; }
  .v-weather  { animation: glow 5.8s ease-in-out infinite; animation-delay: 0.4s; }
  .v-location { animation: glow 5.2s ease-in-out infinite; animation-delay: 0.8s; }
  .v-latlong  { animation: glow 6.4s ease-in-out infinite; animation-delay: 1.2s; }
  .v-air      { animation: glow 4.2s ease-in-out infinite; animation-delay: 1.6s; }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 6px currentColor, 0 0 0px currentColor; }
    50%      { text-shadow: 0 0 22px currentColor, 0 0 8px currentColor; }
  }

  /* a sharper, one-shot flash fired whenever a real message arrives */
  .var.flash {
    animation: flash 700ms ease-out !important;
  }
  @keyframes flash {
    0%   { filter: brightness(2.2); }
    100% { filter: brightness(1); }
  }

  #status {
    position: fixed;
    top: 18px;
    right: 22px;
    font-size: clamp(0.65rem, 1vw, 0.85rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  #status .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--ink-dim);
    vertical-align: middle;
  }
  #status.connected .dot { background: #7ee08a; }
  #status.connected { color: #7ee08a; }
  #status.error .dot { background: #f5715f; }
  #status.error { color: #f5715f; }
</style>
</head>
<body>

  <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>

  <main>
    <p id="story">
      Welcome to <span id="v-place" class="var pending wrap v-place">somewhere</span>.
      Current conditions: <span id="v-weather" class="var pending wrap v-weather">an unmeasured sky</span>.
      Somewhere out there, near <span id="v-latlong" class="var pending v-latlong">an unfixed coordinate</span>
      &mdash; a GPS fix accurate to about <span id="v-location" class="var pending v-location">an uncertain radius</span> &mdash;
      the air quality index reads <span id="v-air" class="var pending wrap v-air">an unread breath</span>.
      This is the world Vaporware senses right now.
    </p>
  </main>

<script>
(function () {
  // --- Configuration -------------------------------------------------
  // Override with ?host=...&port=... if Spacebrew isn't on localhost:8088.
  const params = new URLSearchParams(location.search);
  const WS_HOST = params.get('host') || 'localhost';
  const WS_PORT = params.get('port') || '8088';

  const CLIENT_NAME = 'ContextStory';
  const DESCRIPTION = 'Turns place/location/weather/air-quality context into a live story.';
  const SUBSCRIBERS = [
    'place:string',
    'weather:json',
    'location:json',
    'location_latlong:string',
    'air_quality:json',
  ];

  // Spacebrew subscriber name -> DOM element id, kept separate since
  // "air_quality" (topic) maps to the shorter "v-air" (element id).
  const ELEMENT_FOR_SUB = {
    place: 'v-place',
    weather: 'v-weather',
    location: 'v-location',
    location_latlong: 'v-latlong',
    air_quality: 'v-air',
  };

  const statusEl = document.getElementById('status');
  const statusTextEl = document.getElementById('status-text');
  let reconnectTimer = null;

  function setStatus(text, cls) {
    statusTextEl.textContent = text;
    statusEl.className = cls || '';
  }

  // --- Payload parsing ---------------------------------------------------
  // VaporwareEnvironmentObserver publishes weather/location/air_quality as
  // JSON and place/location_latlong as plain strings (see the header
  // comment for the exact shapes). Every parser below falls back to
  // showing the raw text if it isn't the JSON it expects, rather than
  // throwing — so a differently-shaped test publisher still renders
  // *something* instead of breaking the page.
  function tryParseJSON(raw) {
    try {
      return JSON.parse(raw);
    } catch (err) {
      return null;
    }
  }

  function formatWeather(raw) {
    const d = tryParseJSON(raw);
    if (!d || typeof d.temperature_c !== 'number') return raw;
    const c = Math.round(d.temperature_c);
    const f = Math.round(d.temperature_c * 9 / 5 + 32);
    const condition = d.condition || 'unclear skies';
    return `${c}°C (${f}°F) and ${condition}`;
  }

  function formatLocationAccuracy(raw) {
    const d = tryParseJSON(raw);
    if (!d || typeof d.accuracy !== 'number') return raw;
    return `±${Math.round(d.accuracy)}m`;
  }

  function formatLatLong(raw) {
    const parts = raw.split(',').map(function (s) { return s.trim(); });
    if (parts.length !== 2) return raw;
    const lat = parseFloat(parts[0]);
    const lon = parseFloat(parts[1]);
    if (Number.isNaN(lat) || Number.isNaN(lon)) return raw;
    return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  }

  // A standard EPA AQI scale (0-500), used both to label the number and
  // to color it. Falls back to the default green + raw text for
  // anything that isn't a plain number or a recognized category word.
  function aqiCategory(aqi) {
    if (aqi <= 50) return { label: 'Good', color: '#7ee08a' };
    if (aqi <= 100) return { label: 'Moderate', color: '#f5e06a' };
    if (aqi <= 150) return { label: 'Unhealthy for Sensitive Groups', color: '#f5a95f' };
    if (aqi <= 200) return { label: 'Unhealthy', color: '#f5715f' };
    if (aqi <= 300) return { label: 'Very Unhealthy', color: '#c76ce0' };
    return { label: 'Hazardous', color: '#b23b3b' };
  }

  // Fallback coloring for a plain category word, when the message isn't
  // JSON or a bare number at all (checked longest phrase first so
  // "unhealthy for sensitive groups" doesn't get caught by "unhealthy").
  const AQI_LABEL_COLORS = [
    ['hazardous', '#b23b3b'],
    ['very unhealthy', '#c76ce0'],
    ['unhealthy for sensitive groups', '#f5a95f'],
    ['unhealthy', '#f5715f'],
    ['moderate', '#f5e06a'],
    ['good', '#7ee08a'],
  ];

  function formatAirQuality(raw) {
    const d = tryParseJSON(raw);
    const aqi = d && typeof d.us_aqi === 'number' ? Math.round(d.us_aqi)
      : (/^-?\d/.test(raw.trim()) ? Math.round(parseFloat(raw)) : null);

    if (aqi !== null && !Number.isNaN(aqi)) {
      const cat = aqiCategory(aqi);
      return { text: `${aqi} (${cat.label})`, color: cat.color };
    }

    const text = raw.toLowerCase();
    for (const [label, color] of AQI_LABEL_COLORS) {
      if (text.includes(label)) return { text: raw, color: color };
    }
    return { text: raw, color: null }; // unrecognized — leave the CSS default in place
  }

  const FORMATTERS = {
    place: function (raw) { return { text: raw, color: null }; },
    weather: function (raw) { return { text: formatWeather(raw), color: null }; },
    location: function (raw) { return { text: formatLocationAccuracy(raw), color: null }; },
    location_latlong: function (raw) { return { text: formatLatLong(raw), color: null }; },
    air_quality: formatAirQuality,
  };

  // --- Rendering -------------------------------------------------------
  function updateVar(subName, message) {
    const elId = ELEMENT_FOR_SUB[subName];
    if (!elId) return;
    const el = document.getElementById(elId);
    if (!el) return;

    const formatter = FORMATTERS[subName] || function (raw) { return { text: raw, color: null }; };
    const { text, color } = formatter(message);

    el.textContent = text;
    el.classList.remove('pending');
    if (color) el.style.color = color;

    // Restart the flash animation even if one is already mid-flight.
    el.classList.remove('flash');
    void el.offsetWidth; // force reflow so the animation re-triggers
    el.classList.add('flash');
  }

  // --- Spacebrew 2.0 WebSocket client -----------------------------------
  function connect() {
    const ws = new WebSocket(`ws://${WS_HOST}:${WS_PORT}/ws/client`);

    ws.onopen = function () {
      setStatus('live', 'connected');

      const subsStr = SUBSCRIBERS.join(', ');
      const regMsg = `${CLIENT_NAME}, ${DESCRIPTION}, pubs(), subs(${subsStr})`;
      ws.send(JSON.stringify({ cmd: 'register', message: regMsg }));

      SUBSCRIBERS.forEach(function (sub) {
        const subName = sub.split(':')[0];
        const topic = `${CLIENT_NAME}/${subName}`;
        ws.send(JSON.stringify({ cmd: 'subscribe', topic: topic }));
      });
    };

    ws.onmessage = function (event) {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (!data || !data.topic) return;

      const prefix = CLIENT_NAME + '/';
      if (!data.topic.startsWith(prefix)) return;

      const subName = data.topic.slice(prefix.length);
      updateVar(subName, String(data.message));
    };

    ws.onclose = function () {
      setStatus('offline — retrying…', 'error');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = function () {
      ws.close();
    };
  }

  connect();
})();
</script>

</body>
</html>
